# Detection runtime derived from Ultralytics under AGPL-3.0.
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gsf-yolo-runtime"
dynamic = ["version"]
description = "Reproducibility runtime for GSF-YOLO UAV object detection"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0" }
dependencies = ["numpy", "matplotlib", "opencv-python", "pillow", "pyyaml", "requests", "scipy", "torch", "torchvision", "psutil", "polars", "ultralytics-thop", "pycocotools"]

[project.urls]
Source = "https://github.com/BunnyAssassins/GSF-YOLO"

[tool.setuptools]
packages = { find = { where = ["."], include = ["ultralytics", "ultralytics.*"] } }
package-data = { ultralytics = ["**/*.yaml"] }

[tool.setuptools.dynamic]
version = { attr = "ultralytics.__version__" }
